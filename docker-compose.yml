cat << 'EOF' > /opt/wwwroot/opencart/docker-compose.yml
services:
  db:
    image: mariadb:10.11
    container_name: opencart-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: db_root_pass123
      MYSQL_DATABASE: opencart_db
      MYSQL_USER: opencart_user
      MYSQL_PASSWORD: opencart_pass123
    volumes:
      - mariadb_data:/var/lib/mysql

  opencart:
    image: php:7.4-apache
    container_name: opencart-app
    restart: always
    ports:
      - "80:80"
    volumes:
      - opencart_data:/var/www/html
    depends_on:
      - db

volumes:
  mariadb_data:
  opencart_data:
EOF
