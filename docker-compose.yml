version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: opencart-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: db_root_pass123
      MYSQL_DATABASE: opencart_db
      MYSQL_USER: opencart_user
      MYSQL_PASSWORD: opencart_pass123
    volumes:
      - mariadb_data:/var/lib/mysql

  opencart:
    image: vimagick/opencart:3.0.3.8
    container_name: opencart-app
    restart: always
    ports:
      - "80:80"
    environment:
      - OPENCART_DATABASE_HOST=db
      - OPENCART_DATABASE_USER=opencart_user
      - OPENCART_DATABASE_PASSWORD=opencart_pass123
      - OPENCART_DATABASE_NAME=opencart_db
    volumes:
      - opencart_data:/var/www/html
    depends_on:
      - db

volumes:
  mariadb_data:
    driver: local
  opencart_data:
    driver: local
